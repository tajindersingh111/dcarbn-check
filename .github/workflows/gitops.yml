name: Kubernetes and GitOps validation

on:
  pull_request:
    paths:
      - "deploy/kubernetes/**"
      - "deploy/gitops/**"
      - "deploy/policies/**"
      - "deploy/progressive-delivery/**"
      - ".github/workflows/gitops.yml"
  push:
    branches: ["main", "production"]
    paths:
      - "deploy/kubernetes/**"
      - "deploy/gitops/**"
      - "deploy/policies/**"
      - "deploy/progressive-delivery/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install Kustomize
        run: |
          curl -sSfL \
            https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
            | bash
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Install kubeconform
        run: |
          version="0.6.7"
          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/v${version}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Render overlays
        run: |
          mkdir -p artifacts/manifests
          for overlay in staging production-primary production-standby; do
            kustomize build "deploy/kubernetes/overlays/${overlay}" \
              > "artifacts/manifests/${overlay}.yml"
          done

      - name: Validate Kubernetes schemas
        run: |
          for manifest in artifacts/manifests/*.yml; do
            kubeconform \
              -strict \
              -summary \
              -ignore-missing-schemas \
              "$manifest"
          done

      - name: Reject mutable images
        run: |
          if grep -REn 'image: .*:(latest|main|master|production)([[:space:]]|$)' \
            artifacts/manifests; then
            echo "Mutable image tag found."
            exit 1
          fi
          if grep -REn 'image: ghcr.io/.+@sha256:REPLACE_' artifacts/manifests; then
            echo "Unresolved image digest placeholder found."
            exit 1
          fi

      - name: Validate policy and GitOps YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          roots = [
              Path("deploy/gitops"),
              Path("deploy/policies"),
          ]
          for root in roots:
              for path in root.rglob("*.yml"):
                  list(yaml.safe_load_all(path.read_text()))
          PY

      - name: Install Kyverno CLI
        run: |
          version="1.13.2"
          curl -sSfL \
            "https://github.com/kyverno/kyverno/releases/download/v${version}/kyverno-cli_v${version}_linux_x86_64.tar.gz" \
            | tar -xz
          sudo mv kyverno /usr/local/bin/kyverno

      - name: Test Kyverno policies
        run: |
          kyverno apply deploy/policies/kyverno \
            --resource artifacts/manifests/production-primary.yml \
            --table \
            > artifacts/kyverno-production.txt

      - name: Validate progressive-delivery scripts
        run: |
          python -m py_compile \
            deploy/progressive-delivery/promote-release.py \
            deploy/progressive-delivery/collect-gitops-evidence.py
          bash -n deploy/progressive-delivery/abort-rollout.sh

      - name: Generate manifest checksums
        run: |
          sha256sum artifacts/manifests/*.yml \
            > artifacts/manifests.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: kubernetes-gitops-validation
          path: artifacts/
          retention-days: 90

  promotion-contract:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@v4

      - name: Verify release-gate and supply-chain evidence inputs
        env:
          BACKEND_DIGEST: ${{ vars.PRODUCTION_BACKEND_DIGEST }}
          FRONTEND_DIGEST: ${{ vars.PRODUCTION_FRONTEND_DIGEST }}
        run: |
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Create immutable promotion patch
        env:
          BACKEND_DIGEST: ${{ vars.PRODUCTION_BACKEND_DIGEST }}
          FRONTEND_DIGEST: ${{ vars.PRODUCTION_FRONTEND_DIGEST }}
        run: |
          python deploy/progressive-delivery/promote-release.py \
            --overlay deploy/kubernetes/overlays/production-primary \
            --backend-digest "$BACKEND_DIGEST" \
            --frontend-digest "$FRONTEND_DIGEST" \
            --release-version "${GITHUB_REF_NAME}" \
            --commit-sha "${GITHUB_SHA}" \
            --evidence artifacts/gitops-promotion.json

      - uses: actions/upload-artifact@v4
        with:
          name: gitops-promotion-evidence
          path: artifacts/gitops-promotion.json
          retention-days: 365
