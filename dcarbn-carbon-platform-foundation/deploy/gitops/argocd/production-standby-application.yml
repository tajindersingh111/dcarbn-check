apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dcarbn-production-standby
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: dcarbn-carbon-platform
spec:
  project: dcarbn
  source:
    repoURL: https://github.com/example/dcarbn-carbon-platform.git
    targetRevision: production
    path: deploy/kubernetes/overlays/production-standby
  destination:
    server: https://standby-cluster.example.com
    namespace: dcarbn-standby
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
  revisionHistoryLimit: 10
