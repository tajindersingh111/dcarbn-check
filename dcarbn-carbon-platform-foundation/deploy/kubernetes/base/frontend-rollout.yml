apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: dcarbn-frontend
  namespace: dcarbn
  labels:
    app.kubernetes.io/name: dcarbn-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: dcarbn-carbon-platform
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dcarbn-frontend
  strategy:
    canary:
      stableService: dcarbn-frontend-stable
      canaryService: dcarbn-frontend-canary
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 10
        - pause:
            duration: 2m
        - analysis:
            templates:
              - templateName: dcarbn-frontend-canary
        - setWeight: 50
        - pause:
            duration: 5m
        - analysis:
            templates:
              - templateName: dcarbn-frontend-canary
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcarbn-frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: dcarbn-carbon-platform
    spec:
      serviceAccountName: dcarbn-frontend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: dcarbn-frontend
      containers:
        - name: frontend
          image: ghcr.io/example/dcarbn-frontend@sha256:REPLACE_FRONTEND_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: dcarbn-frontend-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
