global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "service", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical
      repeat_interval: 30m

receivers:
  - name: default
    webhook_configs:
      - url: http://alert-webhook:8080/alerts
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: http://alert-webhook:8080/critical
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "service"]
