apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dcarbn-backend
  namespace: dcarbn
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dcarbn-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dcarbn-frontend
  namespace: dcarbn
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: dcarbn-frontend
