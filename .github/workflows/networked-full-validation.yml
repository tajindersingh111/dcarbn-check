name: Networked full validation

on:
  workflow_dispatch:
    inputs:
      create_lockfile_pull_request:
        description: Create a pull request containing frontend/package-lock.json
        required: true
        type: boolean
        default: true
      run_live_api_test:
        description: Run the optional live API Playwright smoke test
        required: true
        type: boolean
        default: false
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - "docker-compose*.yml"
      - ".github/workflows/networked-full-validation.yml"

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: networked-full-validation-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  TEST_SECRET_KEY: test-secret-key-that-is-at-least-thirty-two-characters
  TEST_MFA_KEY: test-mfa-key-that-is-at-least-thirty-two-characters

jobs:
  frontend-lockfile:
    name: Generate frontend lockfile
    runs-on: ubuntu-latest
    outputs:
      lockfile_sha256: ${{ steps.lockfile.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: npm install --global npm@10.8.2

      - name: Generate deterministic npm lockfile
        id: lockfile
        working-directory: frontend
        shell: bash
        run: |
          set -Eeuo pipefail
          npm config set registry "${NPM_CONFIG_REGISTRY}"
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund
          npm install \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund
          git diff --exit-code package-lock.json || true
          sha256="$(sha256sum package-lock.json | awk '{print $1}')"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          printf '%s  package-lock.json\n' "$sha256" \
            > package-lock.json.sha256

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile
          path: |
            frontend/package-lock.json
            frontend/package-lock.json.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create lockfile pull request
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.create_lockfile_pull_request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "The committed lockfile is already current."
            exit 0
          fi

          branch="automation/frontend-lockfile-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add frontend/package-lock.json
          git commit -m "chore(frontend): add deterministic npm lockfile"
          git push --set-upstream origin "$branch"

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$branch" \
            --title "chore(frontend): add deterministic npm lockfile" \
            --body-file - <<'EOF'
          Generated in the networked full-validation workflow from
          `frontend/package.json` using the public npm registry.

          Merge only after the backend, frontend, container, and Kubernetes jobs
          in the same workflow run pass.
          EOF

  backend:
    name: Backend migrations, quality, and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dcarbn_test
          POSTGRES_USER: dcarbn
          POSTGRES_PASSWORD: dcarbn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dcarbn -d dcarbn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      SECRET_KEY: test-secret-key-that-is-at-least-thirty-two-characters
      MFA_ENCRYPTION_KEY: test-mfa-key-that-is-at-least-thirty-two-characters
      DATABASE_URL: postgresql+asyncpg://dcarbn:dcarbn@localhost:5432/dcarbn_test
      REDIS_URL: redis://localhost:6379/15
      CORS_ORIGINS: http://localhost:3000
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
      TRUSTED_PROXY_IPS: 127.0.0.1,::1
      FRONTEND_BASE_URL: http://localhost:3000
      EMAIL_PROVIDER: console
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_FAIL_OPEN: "true"
      REDIS_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate migration graph
        working-directory: backend
        run: alembic heads

      - name: Apply migrations to PostgreSQL
        working-directory: backend
        run: alembic upgrade head

      - name: Verify migration state
        working-directory: backend
        run: alembic current

      - name: Ruff
        working-directory: backend
        run: ruff check app tests

      - name: Mypy strict
        working-directory: backend
        run: mypy app

      - name: Pytest
        working-directory: backend
        run: |
          mkdir -p ../artifacts/backend
          pytest \
            --junitxml=../artifacts/backend/junit.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:../artifacts/backend/coverage.xml

      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-validation
          path: artifacts/backend/
          if-no-files-found: warn
          retention-days: 90

  frontend:
    name: Frontend typecheck, build, and Playwright
    needs: frontend-lockfile
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_ACCESS_TOKEN: ${{ secrets.E2E_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: frontend-lockfile
          path: .

      - name: Verify lockfile checksum
        working-directory: frontend
        run: sha256sum --check package-lock.json.sha256

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          registry-url: https://registry.npmjs.org/

      - name: Pin npm version
        run: npm install --global npm@10.8.2

      - name: Install exact frontend dependency graph
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright deterministic suites
        working-directory: frontend
        run: |
          mkdir -p ../artifacts/frontend
          npx playwright test \
            e2e/auth.spec.ts \
            e2e/security.spec.ts \
            e2e/workflows.spec.ts \
            --reporter=line,junit \
            --output=../artifacts/frontend/test-results
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: ../artifacts/frontend/playwright.xml

      - name: Playwright live API smoke
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.run_live_api_test &&
          env.E2E_ACCESS_TOKEN != ''
        working-directory: frontend
        run: npm run test:e2e:live
        env:
          E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}

      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-validation
          path: |
            artifacts/frontend/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 90

  containers:
    name: Container builds and runtime smoke
    needs: frontend-lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: frontend-lockfile
          path: .

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build \
            --tag dcarbn-backend:ci \
            backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000/api/v1 \
            --tag dcarbn-frontend:ci \
            frontend

      - name: Start database dependencies
        run: |
          docker network create dcarbn-ci
          docker run -d \
            --name postgres \
            --network dcarbn-ci \
            -e POSTGRES_DB=dcarbn \
            -e POSTGRES_USER=dcarbn \
            -e POSTGRES_PASSWORD=dcarbn \
            postgres:16-alpine
          docker run -d \
            --name redis \
            --network dcarbn-ci \
            redis:7-alpine
          for attempt in $(seq 1 30); do
            docker exec postgres pg_isready -U dcarbn -d dcarbn &&
              docker exec redis redis-cli ping | grep -q PONG &&
              exit 0
            sleep 2
          done
          exit 1

      - name: Apply containerized migrations
        run: |
          docker run --rm \
            --network dcarbn-ci \
            -e APP_ENV=test \
            -e SECRET_KEY="${TEST_SECRET_KEY}" \
            -e MFA_ENCRYPTION_KEY="${TEST_MFA_KEY}" \
            -e DATABASE_URL=postgresql+asyncpg://dcarbn:dcarbn@postgres:5432/dcarbn \
            -e REDIS_URL=redis://redis:6379/0 \
            -e CORS_ORIGINS=http://localhost:3000 \
            -e TRUSTED_HOSTS=localhost,127.0.0.1 \
            -e FRONTEND_BASE_URL=http://localhost:3000 \
            dcarbn-backend:ci \
            alembic upgrade head

      - name: Start application containers
        run: |
          docker run -d \
            --name backend \
            --network dcarbn-ci \
            -p 8000:8000 \
            -e APP_ENV=test \
            -e SECRET_KEY="${TEST_SECRET_KEY}" \
            -e MFA_ENCRYPTION_KEY="${TEST_MFA_KEY}" \
            -e DATABASE_URL=postgresql+asyncpg://dcarbn:dcarbn@postgres:5432/dcarbn \
            -e REDIS_URL=redis://redis:6379/0 \
            -e CORS_ORIGINS=http://localhost:3000 \
            -e TRUSTED_HOSTS=localhost,127.0.0.1 \
            -e FRONTEND_BASE_URL=http://localhost:3000 \
            dcarbn-backend:ci

          docker run -d \
            --name frontend \
            --network dcarbn-ci \
            -p 3000:3000 \
            dcarbn-frontend:ci

      - name: Runtime health smoke
        run: |
          for attempt in $(seq 1 40); do
            curl --fail --silent http://127.0.0.1:8000/api/v1/health/live &&
              curl --fail --silent http://127.0.0.1:3000/ >/dev/null &&
              exit 0
            sleep 3
          done
          exit 1

      - name: Validate Compose models
        run: |
          mkdir -p artifacts/containers
          docker compose -f docker-compose.yml config \
            > artifacts/containers/compose-development.yml

          env \
            REDIS_PASSWORD=ci-redis-password \
            EMAIL_FROM_ADDRESS=ci@example.com \
            SMTP_HOST=smtp.example.com \
            SMTP_USERNAME=ci \
            FRONTEND_BASE_URL=https://carbon.example.com \
            CORS_ORIGINS=https://carbon.example.com \
            TRUSTED_HOSTS=carbon.example.com \
            NEXT_PUBLIC_API_BASE_URL=https://carbon.example.com/api/v1 \
            docker compose -f docker-compose.production.yml config \
            > artifacts/containers/compose-production.yml

      - name: Capture container evidence
        if: always()
        run: |
          mkdir -p artifacts/containers
          docker ps -a > artifacts/containers/docker-ps.txt || true
          docker logs backend > artifacts/containers/backend.log 2>&1 || true
          docker logs frontend > artifacts/containers/frontend.log 2>&1 || true
          docker logs postgres > artifacts/containers/postgres.log 2>&1 || true
          docker logs redis > artifacts/containers/redis.log 2>&1 || true
          docker image inspect dcarbn-backend:ci \
            > artifacts/containers/backend-image.json 2>/dev/null || true
          docker image inspect dcarbn-frontend:ci \
            > artifacts/containers/frontend-image.json 2>/dev/null || true

      - name: Upload container evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-validation
          path: artifacts/containers/
          if-no-files-found: warn
          retention-days: 90

  kubernetes:
    name: Kubernetes, Kustomize, and policy validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install kubeconform
        run: |
          version="0.6.7"
          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/v${version}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Install Kyverno CLI
        run: |
          version="1.13.2"
          curl -sSfL \
            "https://github.com/kyverno/kyverno/releases/download/v${version}/kyverno-cli_v${version}_linux_x86_64.tar.gz" \
            | tar -xz
          sudo install -m 0755 kyverno /usr/local/bin/kyverno

      - name: Prepare validation overlays with immutable test digests
        run: |
          cp -R deploy/kubernetes artifacts-kubernetes
          python - <<'PY'
          from pathlib import Path

          root = Path("artifacts-kubernetes")
          digest = "sha256:" + ("a" * 64)
          for path in root.rglob("kustomization.yml"):
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  "sha256:REPLACE_STAGING_BACKEND_DIGEST",
                  digest,
              ).replace(
                  "sha256:REPLACE_STAGING_FRONTEND_DIGEST",
                  digest,
              ).replace(
                  "sha256:REPLACE_PRODUCTION_BACKEND_DIGEST",
                  digest,
              ).replace(
                  "sha256:REPLACE_PRODUCTION_FRONTEND_DIGEST",
                  digest,
              ).replace(
                  "sha256:REPLACE_STANDBY_BACKEND_DIGEST",
                  digest,
              ).replace(
                  "sha256:REPLACE_STANDBY_FRONTEND_DIGEST",
                  digest,
              )
              path.write_text(text, encoding="utf-8")
          PY

      - name: Render all overlays
        run: |
          mkdir -p artifacts/kubernetes
          for overlay in staging production-primary production-standby; do
            kubectl kustomize \
              "artifacts-kubernetes/overlays/${overlay}" \
              > "artifacts/kubernetes/${overlay}.yml"
          done

      - name: Validate Kubernetes schemas
        run: |
          for manifest in artifacts/kubernetes/*.yml; do
            kubeconform \
              -strict \
              -summary \
              -ignore-missing-schemas \
              "$manifest"
          done

      - name: Enforce immutable images
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(
              r"^\s*image:\s*(\S+)\s*$",
              re.MULTILINE,
          )
          failures = []
          for path in Path("artifacts/kubernetes").glob("*.yml"):
              text = path.read_text(encoding="utf-8")
              for image in pattern.findall(text):
                  if "@sha256:" not in image:
                      failures.append(f"{path}: {image}")
          if failures:
              raise SystemExit("\n".join(failures))
          PY

      - name: Evaluate Kyverno policies
        run: |
          kyverno apply deploy/policies/kyverno \
            --resource artifacts/kubernetes/production-primary.yml \
            --table \
            > artifacts/kubernetes/kyverno-production.txt

      - name: Validate Argo CD and policy YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for directory in (
              Path("deploy/gitops"),
              Path("deploy/policies"),
          ):
              for path in directory.rglob("*.yml"):
                  list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
          PY

      - name: Manifest checksums
        run: |
          sha256sum artifacts/kubernetes/*.yml \
            > artifacts/kubernetes/manifests.sha256

      - name: Upload Kubernetes evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-validation
          path: artifacts/kubernetes/
          if-no-files-found: warn
          retention-days: 90

  validation-summary:
    name: Validation summary
    if: always()
    needs:
      - frontend-lockfile
      - backend
      - frontend
      - containers
      - kubernetes
    runs-on: ubuntu-latest
    steps:
      - name: Write machine-readable result
        env:
          LOCKFILE_RESULT: ${{ needs.frontend-lockfile.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
          KUBERNETES_RESULT: ${{ needs.kubernetes.result }}
          LOCKFILE_SHA256: ${{ needs.frontend-lockfile.outputs.lockfile_sha256 }}
        run: |
          mkdir -p artifacts/summary
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          results = {
              "frontend_lockfile": os.environ["LOCKFILE_RESULT"],
              "backend": os.environ["BACKEND_RESULT"],
              "frontend": os.environ["FRONTEND_RESULT"],
              "containers": os.environ["CONTAINERS_RESULT"],
              "kubernetes": os.environ["KUBERNETES_RESULT"],
          }
          passed = all(value == "success" for value in results.values())
          payload = {
              "schema_version": 1,
              "generated_at": datetime.now(UTC).isoformat(),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "lockfile_sha256": os.environ.get("LOCKFILE_SHA256"),
              "result": "passed" if passed else "failed",
              "jobs": results,
          }
          Path("artifacts/summary/networked-validation.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          raise SystemExit(0 if passed else 1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: networked-validation-summary
          path: artifacts/summary/
          if-no-files-found: error
          retention-days: 365
