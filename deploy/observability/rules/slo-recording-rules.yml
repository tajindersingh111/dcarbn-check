groups:
  - name: dcarbn-slo-recording
    interval: 30s
    rules:
      - record: dcarbn:sli_availability:ratio_rate5m
        expr: |
          1 - (
            sum(rate(dcarbn_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(dcarbn_http_requests_total[5m])), 0.001)
          )

      - record: dcarbn:sli_availability:ratio_rate1h
        expr: |
          1 - (
            sum(rate(dcarbn_http_requests_total{status=~"5.."}[1h]))
            /
            clamp_min(sum(rate(dcarbn_http_requests_total[1h])), 0.001)
          )

      - record: dcarbn:sli_error:ratio_rate5m
        expr: |
          sum(rate(dcarbn_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(dcarbn_http_requests_total[5m])), 0.001)

      - record: dcarbn:sli_error:ratio_rate1h
        expr: |
          sum(rate(dcarbn_http_requests_total{status=~"5.."}[1h]))
          /
          clamp_min(sum(rate(dcarbn_http_requests_total[1h])), 0.001)

      - record: dcarbn:sli_latency_p95:seconds_rate5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(dcarbn_http_request_duration_seconds_bucket[5m])
            )
          )

      - record: dcarbn:sli_latency_p95:seconds_rate1h
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(dcarbn_http_request_duration_seconds_bucket[1h])
            )
          )

      - record: dcarbn:slo_availability:error_budget_remaining
        expr: |
          1 - (
            (
              sum(rate(dcarbn_http_requests_total{status=~"5.."}[30d]))
              /
              clamp_min(sum(rate(dcarbn_http_requests_total[30d])), 0.001)
            )
            /
            0.001
          )
