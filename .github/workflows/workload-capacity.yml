name: Workload capacity validation

on:
  pull_request:
    paths:
      - "backend/app/models/workload.py"
      - "backend/app/services/workloads.py"
      - "backend/scripts/workload_capacity.py"
      - "deploy/monitoring/workload-alerts.yml"
      - ".github/workflows/workload-capacity.yml"
  workflow_dispatch:
    inputs:
      tenants:
        description: "Number of isolated test tenants"
        required: true
        default: "4"
      jobs_per_tenant:
        description: "Workloads per test tenant"
        required: true
        default: "25"
      workers:
        description: "Concurrent worker loops"
        required: true
        default: "8"

permissions:
  contents: read

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dcarbn_test
          POSTGRES_USER: dcarbn
          POSTGRES_PASSWORD: dcarbn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dcarbn -d dcarbn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      ALLOW_DESTRUCTIVE_CAPACITY_TEST: "1"
      SECRET_KEY: "00000000000000000000000000000000"
      MFA_ENCRYPTION_KEY: "11111111111111111111111111111111"
      DATABASE_URL: postgresql+asyncpg://dcarbn:dcarbn@localhost:5432/dcarbn_test
      REDIS_URL: redis://localhost:6379/15
      CORS_ORIGINS: http://localhost:3000
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
      FRONTEND_BASE_URL: http://localhost:3000
      EMAIL_PROVIDER: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: alembic upgrade head
      - name: Run capacity envelope
        run: >-
          python scripts/workload_capacity.py
          --tenants ${{ inputs.tenants || '4' }}
          --jobs-per-tenant ${{ inputs.jobs_per_tenant || '25' }}
          --workers ${{ inputs.workers || '8' }}
          --output artifacts/workload-capacity.json
      - name: Publish capacity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workload-capacity-evidence
          path: backend/artifacts/workload-capacity.json
          if-no-files-found: error
          retention-days: 30
