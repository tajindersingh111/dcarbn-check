apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dcarbn-runtime-secrets
  namespace: dcarbn
  labels:
    app.kubernetes.io/part-of: dcarbn-carbon-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-secret-store
  target:
    name: dcarbn-runtime-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: dcarbn/production
        property: secret_key
    - secretKey: MFA_ENCRYPTION_KEY
      remoteRef:
        key: dcarbn/production
        property: mfa_encryption_key
    - secretKey: DATABASE_URL
      remoteRef:
        key: dcarbn/production
        property: database_url
    - secretKey: REDIS_URL
      remoteRef:
        key: dcarbn/production
        property: redis_url
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: dcarbn/production
        property: smtp_password
    - secretKey: SMTP_HOST
      remoteRef:
        key: dcarbn/production
        property: smtp_host
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: dcarbn/production
        property: smtp_username
    - secretKey: EMAIL_FROM_ADDRESS
      remoteRef:
        key: dcarbn/production
        property: email_from_address
