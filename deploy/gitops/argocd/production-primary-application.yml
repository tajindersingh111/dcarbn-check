apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dcarbn-production-primary
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: dcarbn-carbon-platform
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.operations: ""
spec:
  project: dcarbn
  source:
    repoURL: https://github.com/example/dcarbn-carbon-platform.git
    targetRevision: production
    path: deploy/kubernetes/overlays/production-primary
  destination:
    server: https://primary-cluster.example.com
    namespace: dcarbn-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10
