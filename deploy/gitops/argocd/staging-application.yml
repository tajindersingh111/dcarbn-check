apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dcarbn-staging
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: dcarbn-carbon-platform
spec:
  project: dcarbn
  source:
    repoURL: https://github.com/example/dcarbn-carbon-platform.git
    targetRevision: main
    path: deploy/kubernetes/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: dcarbn-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
