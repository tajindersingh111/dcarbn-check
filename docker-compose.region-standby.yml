services:
  standby-prepare:
    build:
      context: ./deploy/pitr
    profiles:
    - standby-bootstrap
    entrypoint:
    - /usr/local/bin/prepare-standby.sh
    environment:
      STANDBY_PREPARE_CONFIRMATION: ${STANDBY_PREPARE_CONFIRMATION:-}
      PITR_CONFIRMATION: RECOVER-D-CARBN
      PITR_TARGET_DIR: /var/lib/postgresql/data
      PITR_BASE_BACKUP_ROOT: /base-backups
      PITR_REMOTE: ${PITR_SECONDARY_REMOTE:?Set PITR_SECONDARY_REMOTE}
      WAL_ARCHIVE_REMOTE: ${WAL_ARCHIVE_SECONDARY_REMOTE:?Set WAL_ARCHIVE_SECONDARY_REMOTE}
      BACKUP_AGE_IDENTITY_FILE: /run/secrets/backup_age_identity
    secrets:
    - backup_age_identity
    volumes:
    - standby_postgres_data:/var/lib/postgresql/data
    - standby_base_backups:/base-backups
    - ${RCLONE_CONFIG_PATH:-./deploy/backup/rclone.conf.example}:/home/postgres/.config/rclone/rclone.conf:ro
    - ./deploy/postgres/restore-wal.sh:/usr/local/bin/restore-wal.sh:ro
    read_only: true
    tmpfs:
    - /tmp:size=2g,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - standby-data
  standby-postgres:
    build:
      context: ./deploy/postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/standby_postgres_password
      BACKUP_AGE_IDENTITY_FILE: /run/secrets/backup_age_identity
      WAL_ARCHIVE_LOCAL_DIR: /wal-archive
      WAL_ARCHIVE_REMOTE: ${WAL_ARCHIVE_SECONDARY_REMOTE:?Set WAL_ARCHIVE_SECONDARY_REMOTE}
      WAL_ARCHIVE_SECONDARY_REMOTE: ${WAL_ARCHIVE_REMOTE:-}
      DCARBN_REGION: ${STANDBY_REGION:?Set STANDBY_REGION}
      BACKUP_AGE_RECIPIENT_FILE: /run/secrets/backup_age_recipient
    secrets:
    - standby_postgres_password
    - backup_age_identity
    - backup_age_recipient
    command:
    - postgres
    - -c
    - hot_standby=on
    - -c
    - archive_mode=on
    - -c
    - archive_command=/usr/local/bin/archive-wal.sh %p %f
    - -c
    - restore_command=/usr/local/bin/restore-wal.sh %f %p
    - -c
    - recovery_min_apply_delay=${STANDBY_RECOVERY_DELAY:-0}
    volumes:
    - standby_postgres_data:/var/lib/postgresql/data
    - standby_wal_cache:/wal-archive
    - standby_wal_status:/wal-status
    - ${RCLONE_CONFIG_PATH:-./deploy/backup/rclone.conf.example}:/var/lib/postgresql/.config/rclone/rclone.conf:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U dcarbn -d dcarbn
      interval: 10s
      timeout: 5s
      retries: 30
    read_only: true
    tmpfs:
    - /tmp:size=256m,mode=1777
    - /var/run/postgresql:size=16m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - standby-data
  standby-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    - --requirepass
    - ${STANDBY_REDIS_PASSWORD:?Set STANDBY_REDIS_PASSWORD}
    - --maxmemory-policy
    - noeviction
    volumes:
    - standby_redis_data:/data
    networks:
    - standby-data
    security_opt:
    - no-new-privileges:true
  failover-status:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint:
    - /bin/bash
    - -c
    command:
    - "while true; do\n  /scripts/status.sh\n  sleep \"$${FAILOVER_STATUS_INTERVAL_SECONDS}\"\
      \ndone\n"
    environment:
      DATABASE_URL: ${STANDBY_DATABASE_URL:?Set STANDBY_DATABASE_URL}
      DCARBN_REGION: ${STANDBY_REGION:?Set STANDBY_REGION}
      FAILOVER_STATE_FILE: /failover-state/failover.json
      FAILOVER_STATUS_INTERVAL_SECONDS: ${FAILOVER_STATUS_INTERVAL_SECONDS:-30}
    volumes:
    - ./deploy/failover/status.sh:/scripts/status.sh:ro
    - standby_failover_state:/failover-state
    depends_on:
      standby-postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
    - /tmp:size=32m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - standby-data
  failover-controller:
    image: postgres:16-alpine
    profiles:
    - regional-failover
    entrypoint:
    - /bin/bash
    - -c
    command:
    - apk add --no-cache bash curl jq util-linux && /scripts/failover.sh
    environment:
      FAILOVER_CONFIRMATION: ${FAILOVER_CONFIRMATION:-}
      FAILOVER_TARGET_REGION: ${STANDBY_REGION:?Set STANDBY_REGION}
      FAILOVER_STATE_FILE: /failover-state/failover.json
      PRIMARY_HEALTH_URL: ${PRIMARY_HEALTH_URL:?Set PRIMARY_HEALTH_URL}
      PRIMARY_FENCING_HOOK: /hooks/fence-primary.sh
      ROUTING_FAILOVER_HOOK: /hooks/route-region.sh
      FAILOVER_MAX_REPLAY_LAG_SECONDS: ${FAILOVER_MAX_REPLAY_LAG_SECONDS:-30}
      FAILOVER_REPLAY_TIMEOUT_SECONDS: ${FAILOVER_REPLAY_TIMEOUT_SECONDS:-300}
      STANDBY_DATABASE_URL_FILE: /run/secrets/standby_application_database_url
    volumes:
    - ./deploy/failover/failover.sh:/scripts/failover.sh:ro
    - ${PRIMARY_FENCING_HOOK_PATH:-./deploy/failover/fencing-hook.example.sh}:/hooks/fence-primary.sh:ro
    - ${ROUTING_FAILOVER_HOOK_PATH:-./deploy/failover/routing-hook.example.sh}:/hooks/route-region.sh:ro
    - standby_failover_state:/failover-state
    depends_on:
      standby-postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - standby-data
    secrets:
    - standby_application_database_url
  regional-backend:
    build:
      context: ./backend
      target: runtime
    profiles:
    - regional-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECRET_KEY_FILE: /run/secrets/secret_key
      MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
      DATABASE_URL_FILE: /run/secrets/standby_application_database_url
      REDIS_URL_FILE: /run/secrets/standby_redis_url
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      COOKIE_SECURE: 'true'
      COOKIE_SAMESITE: strict
      DOCS_ENABLED: 'false'
      HSTS_ENABLED: 'true'
      REDIS_REQUIRED: 'true'
      RATE_LIMIT_FAIL_OPEN: 'false'
      EXPOSE_TOKENS_IN_API: 'false'
      EMAIL_PROVIDER: smtp
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?Set EMAIL_FROM_ADDRESS}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME}
      SMTP_USE_TLS: 'true'
      FRONTEND_BASE_URL: ${STANDBY_FRONTEND_BASE_URL:?Set STANDBY_FRONTEND_BASE_URL}
      CORS_ORIGINS: ${STANDBY_CORS_ORIGINS:?Set STANDBY_CORS_ORIGINS}
      TRUSTED_HOSTS: ${STANDBY_TRUSTED_HOSTS:?Set STANDBY_TRUSTED_HOSTS}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12}
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      FAILOVER_STATE_FILE: /var/run/dcarbn-failover/failover.json
    secrets:
    - secret_key
    - mfa_encryption_key
    - standby_application_database_url
    - standby_redis_url
    - smtp_password
    depends_on:
      standby-postgres:
        condition: service_healthy
      standby-redis:
        condition: service_started
    command:
    - sh
    - -ec
    - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips='*'
    volumes:
    - standby_failover_state:/var/run/dcarbn-failover:ro
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - standby-edge
    - standby-data
  regional-frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        NEXT_PUBLIC_API_BASE_URL: ${STANDBY_API_BASE_URL:?Set STANDBY_API_BASE_URL}
    profiles:
    - regional-app
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${STANDBY_API_BASE_URL:?Set STANDBY_API_BASE_URL}
    depends_on:
      regional-backend:
        condition: service_healthy
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    networks:
    - standby-edge
  regional-gateway:
    image: nginx:1.27-alpine
    profiles:
    - regional-app
    restart: unless-stopped
    depends_on:
      regional-backend:
        condition: service_healthy
      regional-frontend:
        condition: service_healthy
    ports:
    - ${STANDBY_GATEWAY_PORT:-8081}:8080
    volumes:
    - ./deploy/nginx-region-standby.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
    - /tmp:size=64m,mode=1777
    - /var/cache/nginx:size=64m,mode=1777
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
    security_opt:
    - no-new-privileges:true
    networks:
    - standby-edge
secrets:
  backup_age_identity:
    file: ./secrets/backup_age_identity
  standby_postgres_password:
    file: ./secrets/standby_postgres_password
  secret_key:
    file: ./secrets/secret_key
  mfa_encryption_key:
    file: ./secrets/mfa_encryption_key
  standby_application_database_url:
    file: ./secrets/standby_application_database_url
  standby_redis_url:
    file: ./secrets/standby_redis_url
  smtp_password:
    file: ./secrets/smtp_password
  backup_age_recipient:
    file: ./secrets/backup_age_recipient
volumes:
  standby_postgres_data: null
  standby_base_backups: null
  standby_wal_cache: null
  standby_wal_status: null
  standby_redis_data: null
  standby_failover_state: null
networks:
  standby-data:
    internal: true
  standby-edge: null
