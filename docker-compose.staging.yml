services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dcarbn_staging
      POSTGRES_USER: dcarbn
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcarbn -d dcarbn_staging"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data
    security_opt:
      - no-new-privileges:true

  migration:
    image: dcarbn-backend:staging-current
    build:
      context: ./backend
      target: runtime
    profiles:
      - operations
    restart: "no"
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      RELEASE_SHA: ${RELEASE_SHA:?Set RELEASE_SHA}
      MIGRATION_TARGET: ${MIGRATION_TARGET:?Set MIGRATION_TARGET}
      MIGRATION_PHASE: ${MIGRATION_PHASE:?Set MIGRATION_PHASE}
      MIGRATION_TIMEOUT_SECONDS: ${MIGRATION_TIMEOUT_SECONDS:-600}
      MIGRATION_LOCK_TIMEOUT_SECONDS: ${MIGRATION_LOCK_TIMEOUT_SECONDS:-30}
      OLD_REPLICAS_RETIRED: ${OLD_REPLICAS_RETIRED:-false}
      MIGRATION_EVIDENCE_FILE: /var/run/dcarbn-evidence/migration.json
      BACKUP_STATUS_FILE: /var/run/dcarbn-evidence/backup-status.json
      PITR_STATUS_FILE: /var/run/dcarbn-evidence/pitr-status.json
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - scripts/run_controlled_migrations.py
    volumes:
      - ./deploy/evidence:/var/run/dcarbn-evidence
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - data

  backend:
    image: dcarbn-backend:staging-current
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    environment:
      APP_ENV: staging
      SECRET_KEY_FILE: /run/secrets/secret_key
      MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: strict
      DOCS_ENABLED: "false"
      HSTS_ENABLED: "true"
      REDIS_REQUIRED: "true"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_FAIL_OPEN: "false"
      EXPOSE_TOKENS_IN_API: "false"
      EMAIL_PROVIDER: smtp
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?Set EMAIL_FROM_ADDRESS}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      FRONTEND_BASE_URL: https://${STAGING_DOMAIN:?Set STAGING_DOMAIN}
      CORS_ORIGINS: https://${STAGING_DOMAIN:?Set STAGING_DOMAIN}
      TRUSTED_HOSTS: ${STAGING_DOMAIN:?Set STAGING_DOMAIN}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-172.16.0.0/12}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
    secrets:
      - secret_key
      - mfa_encryption_key
      - database_url
      - redis_url
      - smtp_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 1g
    cpus: 1.0
    networks:
      - edge
      - data

  frontend:
    image: dcarbn-frontend:staging-current
    build:
      context: ./frontend
      target: runtime
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${STAGING_DOMAIN:?Set STAGING_DOMAIN}/api/v1
        NEXT_PUBLIC_APP_ENV: staging
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 512m
    cpus: 0.5
    networks:
      - edge

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:?Set STAGING_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/ionos/Caddyfile:/etc/caddy/Caddyfile:ro
      - staging_caddy_data:/data
      - staging_caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    networks:
      - edge

secrets:
  secret_key:
    file: ./secrets/secret_key
  mfa_encryption_key:
    file: ./secrets/mfa_encryption_key
  database_url:
    file: ./secrets/database_url
  redis_url:
    file: ./secrets/redis_url
  smtp_password:
    file: ./secrets/smtp_password
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_caddy_data:
  staging_caddy_config:

networks:
  edge:
  data:
    internal: true
