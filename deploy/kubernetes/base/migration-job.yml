apiVersion: batch/v1
kind: Job
metadata:
  name: dcarbn-database-migration
  namespace: dcarbn
  labels:
    app.kubernetes.io/name: dcarbn-database-migration
    app.kubernetes.io/part-of: dcarbn-carbon-platform
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcarbn-database-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/example/dcarbn-backend@sha256:REPLACE_BACKEND_DIGEST
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: dcarbn-runtime-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
