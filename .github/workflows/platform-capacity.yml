name: Platform capacity envelope

on:
  pull_request:
    paths:
      - "backend/app/performance/**"
      - "backend/scripts/platform_load.py"
      - "backend/scripts/platform-load-profile.example.json"
      - "backend/tests/test_platform_load_metrics.py"
      - "docs/operations/platform-capacity-envelope.md"
      - ".github/workflows/platform-capacity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      SECRET_KEY: "00000000000000000000000000000000"
      MFA_ENCRYPTION_KEY: "11111111111111111111111111111111"
      DATABASE_URL: sqlite+aiosqlite://
      REDIS_URL: redis://localhost:6379/15
      CORS_ORIGINS: http://localhost:3000
      TRUSTED_HOSTS: localhost,127.0.0.1,testserver
      FRONTEND_BASE_URL: http://localhost:3000
      EMAIL_PROVIDER: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_platform_load_metrics.py
      - run: python -m py_compile scripts/platform_load.py app/performance/load_metrics.py
      - name: Validate example profile
        run: python -m json.tool scripts/platform-load-profile.example.json >/dev/null

  approved-staging-load:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: performance-staging
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend
    env:
      DCARBN_LOAD_TEST_BASE_URL: ${{ vars.DCARBN_LOAD_TEST_BASE_URL }}
      DCARBN_LOAD_TEST_APPROVAL_ID: ${{ vars.DCARBN_LOAD_TEST_APPROVAL_ID }}
      DCARBN_LOAD_TEST_CONFIRMATION: RUN-APPROVED-NON-PRODUCTION-LOAD-TEST
      DCARBN_LOAD_TOKEN_TENANT_A: ${{ secrets.DCARBN_LOAD_TOKEN_TENANT_A }}
      DCARBN_LOAD_TOKEN_TENANT_B: ${{ secrets.DCARBN_LOAD_TOKEN_TENANT_B }}
      DCARBN_LOAD_INVENTORY_A: ${{ vars.DCARBN_LOAD_INVENTORY_A }}
      DCARBN_LOAD_INVENTORY_B: ${{ vars.DCARBN_LOAD_INVENTORY_B }}
      DCARBN_LOAD_REPORT_A: ${{ vars.DCARBN_LOAD_REPORT_A }}
      DCARBN_LOAD_REPORT_B: ${{ vars.DCARBN_LOAD_REPORT_B }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Bind profile to the protected staging host
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          path = Path("scripts/platform-load-profile.example.json")
          profile = json.loads(path.read_text())
          profile["approved_hosts"] = [urlparse(os.environ["DCARBN_LOAD_TEST_BASE_URL"]).hostname]
          path.write_text(json.dumps(profile, indent=2, sort_keys=True) + "\n")
          PY
      - name: Run approved staging profile
        run: >-
          python scripts/platform_load.py
          --profile scripts/platform-load-profile.example.json
          --output artifacts/platform-capacity.json
      - name: Generate evidence checksum
        if: always()
        run: sha256sum artifacts/platform-capacity.json > artifacts/platform-capacity.sha256
      - uses: sigstore/cosign-installer@v3.7.0
        if: success()
      - name: Sign capacity evidence
        if: success()
        run: >-
          cosign sign-blob --yes
          --output-signature artifacts/platform-capacity.sig
          --output-certificate artifacts/platform-capacity.pem
          artifacts/platform-capacity.json
      - name: Retain signed capacity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-capacity-evidence-${{ github.sha }}
          path: backend/artifacts/platform-capacity.*
          if-no-files-found: error
          retention-days: 90
