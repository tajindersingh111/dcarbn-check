apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dcarbn-backend
  namespace: dcarbn
  annotations:
    nginx.ingress.kubernetes.io/server-snippet: |
      return 503;
spec:
  tls:
    - hosts: ["standby.carbon.example.com"]
      secretName: dcarbn-standby-tls
  rules:
    - host: standby.carbon.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dcarbn-frontend
  namespace: dcarbn
  annotations:
    nginx.ingress.kubernetes.io/server-snippet: |
      return 503;
spec:
  tls:
    - hosts: ["standby.carbon.example.com"]
      secretName: dcarbn-standby-tls
  rules:
    - host: standby.carbon.example.com
