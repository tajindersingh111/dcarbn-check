[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dcarbn-carbon-platform"
version = "0.1.0"
description = "Standalone multi-tenant carbon-accounting platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "pyotp>=2.9,<3",
  "cryptography>=43,<46",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1.5,<4",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "PyYAML>=6,<7",
  "redis>=5.0,<6",
  "opentelemetry-instrumentation-sqlalchemy>=0.49b0,<1",
  "opentelemetry-instrumentation-redis>=0.49b0,<1",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
  "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-api>=1.28,<2",
  "prometheus-client>=0.21,<1",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<6",
  "PyYAML>=6,<7",
  "ruff>=0.6,<1",
  "types-openpyxl>=3.1.5,<4",
  "types-PyYAML>=6,<7"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = [
  "B008",  # FastAPI dependency injection deliberately uses Depends(...) defaults.
  "E501",  # Existing long imports are handled separately from correctness checks.
  "F401",  # Legacy unused imports are tracked for incremental clean-up.
  "I001",  # Preserve established import grouping until the formatting pass.
  "UP035", # Defer non-functional typing import modernisation.
  "UP037", # Preserve quoted annotations used by Pydantic models.
  "UP046", # Defer PEP 695 generic class conversion.
  "UP047"  # Defer PEP 695 generic function conversion.
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

# Controlled baseline for pre-existing strict-typing debt. New modules remain strict.
# Remove modules from this list as their annotations are corrected.
[[tool.mypy.overrides]]
module = [
  "app.api.routes.identity",
  "app.auth.dependencies",
  "app.core.logging",
  "app.core.observability",
  "app.middleware.rate_limit",
  "app.middleware.security_headers",
  "app.services.activities",
  "app.services.boundaries",
  "app.services.calculations",
  "app.services.data_integration",
  "app.services.data_review",
  "app.services.email_delivery",
  "app.services.factor_resolution",
  "app.services.inventory_governance",
  "app.services.operational_health",
  "app.services.organisations",
  "app.services.session_auth"
]
ignore_errors = true
